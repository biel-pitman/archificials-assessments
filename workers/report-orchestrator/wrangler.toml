name = "report-orchestrator"
main = "dist/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "archificials-reports"

[vars]
AIRTABLE_BASE_ID = "appB7PmFnNvV3085q"
NOTIFY_EMAIL = "biel@archificials.com"
PROMPT_VERSION = "1.0.0"

# Secrets (set via wrangler secret put):
# AIRTABLE_API_KEY
# RESEND_API_KEY
# REPORT_SECRET
#
# No longer needed (can be removed from Cloudflare dashboard):
# ANTHROPIC_API_KEY
# BRAVE_API_KEY
